# Cofertility fork: builds the patched Twenty image (linux/arm64) and pushes it to ECR.
# Note: upstream's push/PR-triggered workflows should be disabled in the fork's
# Actions settings when Actions is enabled, so they don't run on fork pushes.
name: Cofertility image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. v2.51.0-cf.1'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cf\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must match vX.Y.Z-cf.N (e.g. v2.51.0-cf.1)" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ inputs.tag }}
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ inputs.tag }}
