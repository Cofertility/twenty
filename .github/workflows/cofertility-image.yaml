# Cofertility fork: builds the patched Twenty image (linux/arm64) and pushes it to ECR.
# The repo is public, so its run logs are too: the role ARN and ECR URL are secrets to keep the AWS account ID masked.
# Upstream's workflows are disabled in the fork's Actions settings; only this one runs.
name: Cofertility image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. v2.51.0-cofertility.1'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cofertility-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-cofertility\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must match vX.Y.Z-cofertility.N (e.g. v2.51.0-cofertility.1)" >&2
            exit 1
          fi
          expected_ref="cofertility/v${BASH_REMATCH[1]}"
          if [[ "$REF_NAME" != "$expected_ref" ]]; then
            echo "Tag '$TAG' must be built from $expected_ref, not '$REF_NAME'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ inputs.tag }}
          tags: ${{ secrets.ECR_REPOSITORY_URL }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # ECR tags are immutable, so the layer cache lives in GitHub's cache instead
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
